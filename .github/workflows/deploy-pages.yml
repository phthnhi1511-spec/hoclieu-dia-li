name: Deploy GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase access token
        env:
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_R2_ACCESS_KEY" ] || [ -z "$CLOUDFLARE_R2_SECRET_KEY" ]; then
            echo "::error::Missing CLOUDFLARE_R2_ACCESS_KEY or CLOUDFLARE_R2_SECRET_KEY"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure R2 bucket CORS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 04443c5d0ebe24eaa3c36a88b0f7dc6e
          CLOUDFLARE_R2_BUCKET_NAME: hoc-lieu
          R2_CORS_ALLOWED_ORIGINS: https://phthnhi1511-spec.github.io,http://localhost:5173,http://127.0.0.1:5173
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Missing CLOUDFLARE_API_TOKEN; keeping the existing R2 CORS policy"
            exit 0
          fi
          npm run r2:cors

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Configure R2 Edge Function secrets
        env:
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          R2_ACCESS_KEY="${CLOUDFLARE_R2_ACCESS_KEY##*=}"
          R2_SECRET_KEY="${CLOUDFLARE_R2_SECRET_KEY##*=}"
          R2_ACCESS_KEY="$(printf '%s' "$R2_ACCESS_KEY" | tr -d '\r\n\t \"')"
          R2_SECRET_KEY="$(printf '%s' "$R2_SECRET_KEY" | tr -d '\r\n\t \"')"

          if ! [[ "$R2_ACCESS_KEY" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "::error::CLOUDFLARE_R2_ACCESS_KEY must contain only the 32-character key value"
            exit 1
          fi
          if ! [[ "$R2_SECRET_KEY" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::CLOUDFLARE_R2_SECRET_KEY must contain only the 64-character secret value"
            exit 1
          fi

          supabase secrets set --project-ref jgyqmuradnnqhfrzzhwv \
            CLOUDFLARE_ACCOUNT_ID=04443c5d0ebe24eaa3c36a88b0f7dc6e \
            CLOUDFLARE_R2_BUCKET_NAME=hoc-lieu \
            CLOUDFLARE_R2_PUBLIC_BASE_URL="$CLOUDFLARE_R2_PUBLIC_BASE_URL" \
            CLOUDFLARE_R2_ACCESS_KEY="$R2_ACCESS_KEY" \
            CLOUDFLARE_R2_SECRET_KEY="$R2_SECRET_KEY"

      - name: Deploy R2 Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy r2-presign-upload --project-ref jgyqmuradnnqhfrzzhwv --no-verify-jwt
          supabase functions deploy r2-sign-file-url --project-ref jgyqmuradnnqhfrzzhwv --no-verify-jwt
          supabase functions deploy r2-file-proxy --project-ref jgyqmuradnnqhfrzzhwv --no-verify-jwt

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate public R2 URL
        env:
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        run: |
          if [[ -z "$CLOUDFLARE_R2_PUBLIC_BASE_URL" || "$CLOUDFLARE_R2_PUBLIC_BASE_URL" != https://* ]]; then
            echo "::error::CLOUDFLARE_R2_PUBLIC_BASE_URL must be a public HTTPS URL"
            exit 1
          fi
          if [[ "$CLOUDFLARE_R2_PUBLIC_BASE_URL" == *r2.cloudflarestorage.com* ]]; then
            echo "::error::CLOUDFLARE_R2_PUBLIC_BASE_URL cannot use the private S3 API endpoint"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
